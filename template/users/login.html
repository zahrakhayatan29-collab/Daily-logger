{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Login</title>

    <!-- Custom fonts for this template-->
    <link href="{% static 'vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">

    <!-- Custom styles for this template-->
    <link href="{% static 'css/sb-admin-2.min.css' %}" rel="stylesheet">

</head>

<body class="bg-gradient-primary">

    <div class="container min-vh-100 d-flex align-items-center justify-content-center">

        <!-- کارت تمیز و مرکزچین‌شده -->
        <div class="card o-hidden border-0 shadow-lg my-5 w-100" style="max-width: 450px; border-radius: 20px;">
            <div class="card-body p-4 p-md-5 bg-white">
                
                <!-- هدر فرم ورود -->
                <div class="text-center mb-4">
                    <div class="icon-circle bg-primary text-white mx-auto mb-3" style="width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 50%;">
                        <i class="fas fa-user-lock fa-lg"></i>
                    </div>
                    <h1 class="h4 text-gray-900 font-weight-bold">Welcome Back!</h1>
                    <p class="text-muted small">Enter your credentials to access your account</p>
                </div>

                <!-- نمایش پیام‌های خطا -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger small p-2 text-center rounded-lg" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <!-- فرم ورود -->
                <form class="user" method="POST" action="{% url 'users:login' %}">
                    {% csrf_token %}

                    <!-- Username -->
                    <div class="form-group">
                        <label for="id_username" class="small font-weight-bold text-dark">Username</label>
                        <input type="text" name="username" class="form-control form-control-user" id="id_username" placeholder="Enter Username..." required>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="id_password" class="small font-weight-bold text-dark">Password</label>
                        <input type="password" name="password" class="form-control form-control-user" id="id_password" placeholder="Password" required>
                    </div>

                    <!-- Remember Me -->
                    <div class="form-group">
                        <div class="custom-control custom-checkbox small">
                            <input type="checkbox" name="remember_me" class="custom-control-input" id="customCheck">
                            <label class="custom-control-label font-weight-bold text-dark" for="customCheck">Remember Me</label>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary btn-user btn-block font-weight-bold shadow-sm">
                        Login
                    </button>
                    
                </form>

                <hr class="my-4">
                
                <div class="text-center">
                    <a class="small" href="#">Forgot Password?</a>
                </div>
                <div class="text-center">
                    <a class="small" href="{% url 'users:register' %}">Create an Account!</a>
                </div>

            </div>
        </div>

    </div>

    <!-- Bootstrap core JavaScript-->
    <script src="{% static 'vendor/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>

    <!-- Core plugin JavaScript-->
    <script src="{% static 'vendor/jquery-easing/jquery.easing.min.js' %}"></script>

    <!-- Custom scripts for all pages-->
    <script src="{% static 'js/sb-admin-2.min.js' %}"></script>

</body>

</html>
