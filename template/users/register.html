{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Register</title>

    <!-- Custom fonts for this template-->
    <link href="{% static 'vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">

    <!-- Custom styles for this template-->
    <link href="{% static 'css/sb-admin-2.min.css' %}" rel="stylesheet">

</head>

<body class="bg-gradient-primary">

    <div class="container min-vh-100 d-flex align-items-center justify-content-center">

        <div class="card o-hidden border-0 shadow-lg my-5 w-100" style="max-width: 500px; border-radius: 20px;">
            <div class="card-body p-4 p-md-5 bg-white">
                
                <div class="text-center mb-4">
                    <h1 class="h4 text-gray-900 font-weight-bold">Create an Account!</h1>
                    <p class="text-muted small">Fill in the information below to register</p>
                </div>

                <!-- نمایش پیام‌های خطا -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger small p-2 text-center rounded-lg" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form class="user" method="POST" action="{% url 'users:register' %}">
                    {% csrf_token %}
                    
                    <!-- Username -->
                    <div class="form-group">
                        <input type="text" name="username" class="form-control form-control-user" id="id_username" placeholder="Enter Username..." required>
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <input type="email" name="email" class="form-control form-control-user" id="id_email" placeholder="Email Address" required>
                    </div>

                    <!-- Passwords -->
                    <div class="form-group row">
                        <div class="col-sm-6 mb-3 mb-sm-0">
                            <input type="password" name="password1" class="form-control form-control-user" id="id_password1" placeholder="Password" required>
                        </div>
                        <div class="col-sm-6">
                            <input type="password" name="password2" class="form-control form-control-user" id="id_password2" placeholder="Repeat Password" required>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary btn-user btn-block font-weight-bold shadow-sm">
                        Register Account
                    </button>
                    
                </form>
                
                <hr class="my-4">
                
                <div class="text-center">
                    <a class="small" href="{% url 'users:login' %}">Already have an account? Login!</a>
                </div>

            </div>
        </div>

    </div>

    <!-- Bootstrap core JavaScript-->
    <script src="{% static 'vendor/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>

    <!-- Core plugin JavaScript-->
    <script src="{% static 'vendor/jquery-easing/jquery.easing.min.js' %}"></script>

    <!-- Custom scripts for all pages-->
    <script src="{% static 'js/sb-admin-2.min.js' %}"></script>

</body>

</html>
