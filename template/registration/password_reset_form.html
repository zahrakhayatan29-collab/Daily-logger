
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password</title>
    <link href="{% static 'vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link href="{% static 'css/sb-admin-2.min.css' %}" rel="stylesheet">
</head>
<body class="bg-gradient-primary">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card o-hidden border-0 shadow-lg my-5 w-100" style="max-width: 450px; border-radius: 20px;">
            <div class="card-body p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <h1 class="h4 text-gray-900 font-weight-bold">Forgot Your Password?</h1>
                    <p class="text-muted small">Enter your email address below and we'll send you a link to reset your password!</p>
                </div>
                <form class="user" method="POST">
                    {% csrf_token %}
                    <div class="form-group">
                        <input type="email" name="email" class="form-control form-control-user" placeholder="Enter Email Address..." required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-user btn-block font-weight-bold shadow-sm">
                        Send Reset Link
                    </button>
                </form>
                <hr class="my-4">
                <div class="text-center">
                    <a class="small" href="{% url 'users:login' %}">Remembered? Login!</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
