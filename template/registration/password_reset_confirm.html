
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password</title>
    <link href="{% static 'css/sb-admin-2.min.css' %}" rel="stylesheet">
</head>
<body class="bg-gradient-primary">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card o-hidden border-0 shadow-lg my-5 w-100" style="max-width: 450px; border-radius: 20px;">
            <div class="card-body p-4 p-md-5 bg-white">
                {% if validlink %}
                    <div class="text-center mb-4">
                        <h1 class="h4 text-gray-900 font-weight-bold">Set New Password</h1>
                        <p class="text-muted small">Please enter your new password twice.</p>
                    </div>
                    <form class="user" method="POST">
                        {% csrf_token %}
                        <div class="form-group">
                            <input type="password" name="new_password1" class="form-control form-control-user" placeholder="New Password" required>
                        </div>
                        <div class="form-group">
                            <input type="password" name="new_password2" class="form-control form-control-user" placeholder="Confirm New Password" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-user btn-block font-weight-bold shadow-sm">
                            Change Password
                        </button>
                    </form>
                {% else %}
                    <div class="text-center">
                        <h1 class="h5 text-danger font-weight-bold mb-3">Invalid Link!</h1>
                        <p class="text-muted small">The password reset link was invalid, possibly because it has already been used or has expired.</p>
                        <a href="{% url 'password_reset' %}" class="btn btn-primary btn-user btn-block mt-3">Request a new link</a>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
