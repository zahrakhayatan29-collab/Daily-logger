{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password Reset Complete</title>
    <link href="{% static 'css/sb-admin-2.min.css' %}" rel="stylesheet">
</head>
<body class="bg-gradient-primary">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card o-hidden border-0 shadow-lg my-5 w-100 text-center p-4" style="max-width: 450px; border-radius: 20px;">
            <div class="card-body bg-white">
                <h1 class="h4 text-gray-900 font-weight-bold mb-3">Password Reset Complete!</h1>
                <p class="text-muted small mb-4">Your password has been set. You may go ahead and log in now.</p>
                <a href="{% url 'users:login' %}" class="btn btn-primary btn-user btn-block font-weight-bold">Log In</a>
            </div>
        </div>
    </div>
</body>
</html>
